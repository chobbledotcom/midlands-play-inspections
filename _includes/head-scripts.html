{%- comment -%}
  Favicons. .eleventy.js copies src/assets/favicon/* to the site root, so these
  all resolve from /. Sources are generated from images/logo.png, and small sizes
  crop to the castle-and-tick so they stay legible in a tab.
{%- endcomment -%}
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#052957">
